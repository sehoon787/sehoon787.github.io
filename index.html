<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab2204</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif;
      background: #fafafa;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    .header {
      margin-bottom: 48px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 14px;
      color: #888;
      margin-top: 6px;
    }
    h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaa;
      margin-bottom: 12px;
    }
    .project-list {
      list-style: none;
    }
    .project-list li {
      margin-bottom: 8px;
    }
    .project-list a {
      display: block;
      padding: 16px 20px;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 12px;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: 500;
      transition: box-shadow 0.2s, border-color 0.2s;
    }
    .project-list a:hover {
      border-color: #ddd;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .project-list a span {
      display: block;
      font-size: 13px;
      color: #888;
      font-weight: 400;
      margin-top: 2px;
    }
    .footer {
      margin-top: 60px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Lab2204</h1>
      <p>lab2204.app@gmail.com</p>
    </div>

    <h2>Projects</h2>
    <ul class="project-list">
      <li>
        <a href="NextStop/">
          NextStop
          <span>대중교통 통합 모니터링 플랫폼</span>
        </a>
      </li>
    </ul>

    <div class="footer">
      &copy; 2026 Lab2204
    </div>
  </div>
</body>
</html>
